[build-system]
# hatchling (PyPI 推荐): 标准布局, flash/ 子目录即包, 无 sources 重写,
# 同时支持 `pip install .` 与 `pip install -e .` (dev 模式无前缀追加问题)
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flash-sim"
version = "0.1.7"
description = "FLASH plasma simulation Python interface - third-party wrapper and workflow toolkit for FLASH 4.8 radiation-hydrodynamics code. NOT affiliated with the Flash Center for Computational Science. FLASH must be obtained separately from flash.rochester.edu."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "PhySimX Contributors"},
]
keywords = ["flash", "plasma", "simulation", "high-energy-density", "physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
]

# Runtime dependencies.
# This package is fully self-contained: the base schema/interface/registry live
# in the vendored `flash/_core/` subpackage, so no PhySimX-internal package is needed.
# Every dependency listed here is resolvable from PyPI.
dependencies = [
    "cryptography>=41.0",   # Fernet encryption for the credential store
    "numpy>=1.24",           # Numerical operations
]

[project.urls]
Homepage = "https://gitee.com/physimx/flash"
Repository = "https://gitee.com/physimx/flash"
Issues = "https://gitee.com/physimx/flash/issues"

[project.optional-dependencies]
# Full features: HDF5 I/O, plotting and AMR visualisation.
full = [
    "h5py>=3.8",              # HDF5 file reading
    "matplotlib>=3.7",        # Plotting
    "yt>=4.1",               # FLASH HDF5 visualization
    "pandas>=2.0",            # Tabular diffing in the AMR comparison tests
]

# Development dependencies (含测试与发布工具)
# 注: paramiko (远程部署 SSH) 由 start_flash.py 脚本补装, 不入 dev
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "build>=1.0",
    "twine>=5.0",
    "pandas>=2.0",           # 测试 (amr_visualization 对比)
    "scipy>=1.10",           # 测试 (插值/拟合)
]

[project.scripts]
# CLI tools
flash-cred = "flash._core.credentials:interactive_menu"
flash-setup = "flash.config:main"

[tool.hatch.build.targets.wheel]
packages = ["flash"]
exclude = [
    # === FLASH 版权材料与引擎相关 (License §3) ===
    "flash/flash_src/**",
    "flash/**/ref_f90s/**",
    "flash/**/refs/**",
    "flash/**/ionmix/**",
    "flash/**/MultiEOS/**",
    "flash/**/para_doc/**",
    "flash/**/abjt_03.f",
    "flash/**/SimulationMain/**",
    "flash/input_gen/gen_eos_op/eos_op_data/FLASH_eos_op_data/**",
    "flash/scenarios/flash_demo/LaserSlab*/**",
    "flash/scenarios/flash_demo/LaserSlabPAR.xlsx",
    "flash/scenarios/flash_demo/ReDo042sp_*/**",
    "flash/scenarios/flash_demo/new_struture/**",
    # === FLASH 场景源文件与运行脚本 (需在 FLASH 中单独获取) ===
    "*.F90", "*.f90", "*.F", "*.f",
    "Config", "Makefile", "*.par", "*.sh",
    # === 私有场景: 仅排除 FLASH 版权材料 (sim_input_*), 自研 Python 模块入包 ===
    "flash/scenarios/collision_compression/thin_layer_sandwich/sim_input_*/**",
    "flash/scenarios/collision_compression/thin_layer_sandwich/**/*.cn4",
    "flash/scenarios/collision_compression/grad_dens_sandwich/**",
    "flash/scenarios/sandwich/**/sim_input*/**",
    # === 运行产物 / 测试 / 缓存 ===
    "flash/**/runs_*/**",
    "flash/**/runs/**",
    "flash/**/outputfiles/**",
    "flash/**/output/**",
    "flash/**/inputfiles/**",
    "flash/**/temp/**",
    "flash/**/demo_task/**",
    # === 场景生成的输入/输出数据（★ 必须排除，否则 wheel 会膨胀到 GB 级）===
    # flash_input/  由 ch_center/gen_flash_inputs.py 经 input_gen 生成
    #               （.par / Makefile / Config / F90 / run脚本 / cn4 / 诊断图 / 日志）
    # flash_output/ 分析输出目录（plots 等）
    # ★ 这两条与 .gitignore:403-404 的规则**必须成对维护**：
    #   历史上 pyproject 侧漏了它们，而 .gitignore 侧有 → wheel 构建会静默
    #   打包进 SNBOneCH_m 等场景的 7.4GB 数据（09-09 实测：build 跑 20 分钟
    #   未完成，被迫中止）。.gitignore 只管 git，不管 wheel/sdist 构建。
    #   排查手法：build 前先确认 wheel 体积仍为 MB 级。
    "flash/scenarios/**/flash_input/**",
    "flash/scenarios/**/flash_output/**",
    "**/flash_input_old/**",
    "flash/input_gen/test/**",
    "flash/output_processors/test/**",
    # === ★ 大体积第三方参考数据（必须排除，否则 wheel 达 GB 级）===
    # Multi1D++ 便携包 ≈1.5GB（.dat 参考数据 + .rar 压缩包），是外部
    #   第三方参考解，**不是**本包自研代码，随包分发无意义。
    # ★ .gitignore:72-73,132-133 早已排除，pyproject 侧历史上一直缺失
    #   → 09-09 实测构建出 **1.43GB** 的 wheel（正确值应为 MB 级）。
    "**/src/Multi1D++Portable*/**",
    "**/Multi1D*/**",
    "**/Multi1D*.rar",
    # === 工作副本目录（内容与原目录重复，各占 ~1.5GB）===
    "flash/input_gen/*_copy/**",
    "flash/input_gen/*副本*/**",
    "flash/input_gen/*_copy*",
    "flash/input_gen/*副本*",
    "**/*_copy/**",
    "**/*_Copy/**",
    "**/*_COPY/**",
    "**/*副本*/**",
    # === 打包归档（源/固件tar 球，git 未跟踪但会被 build 扫入）===
    "**/*.rar",
    "**/*.tar",
    "**/*.tgz",
    "**/*.tar.gz",
    # === 诊断遗留/ 临时工作区（09-09 实测: tracer/ 下 _flash_output_contaminated_* 占 354MB）===
    # ★ 这些是**污染快照与调试输出**，不是可复用代码或参考数据：
    #   - docs_diag/_flash_output_contaminated_*/  = 出问题的 chk/log 快照
    #   - .workbuddy/**                          = AI 工作区临时文件
    "**/_flash_output_contaminated_*/**",
    "**/*contaminated*/**",
    "flash/**/.workbuddy/**",
    "flash/**/docs_diag/_*/**",
    # === 用户临时调试脚本 (非通用发布代码, 含硬编码路径) ===
    "flash/flash_run/remote/remote_check.py",
    "flash/flash_run/remote/remote_workflow.py",
    "flash/flash_run/remote/ssh_check.py",
    "flash/**/__pycache__/**",
    "flash/**/.pytest_cache/**",
    # === 二进制/数据文件 ===
    # 注: cn4 仅保留 IONMIX 自研生成表 (Gen_eos_op_data/Z*.cn4, 随包分发,
    #     场景运行必需, Config DATAFILES 引用); 其余 cn4 (FLASH 分发表
    #     he-imx-*/polystyrene-imx-*、自研 Au-imx*/*-BADGER-*/CH-QC-* 等)
    #     一律不入包。
    "*.h5", "*.hdf5", "*.pdf",
    "*-imx-*.cn4", "*-imx-*.cnr", "*-imx-*.imx",
    "*.cnr", "*.imx", "*.ses", "*.png", "*.xlsx",
    # 排除 Gen_eos_op_data 下非 Z*.cn4 自研表目录 (仅 Z*.cn4 随包分发)
    "flash/input_gen/gen_eos_op/eos_op_data/Gen_eos_op_data/Au-imx*/**",
    "flash/input_gen/gen_eos_op/eos_op_data/Gen_eos_op_data/*-BADGER-*/**",
    "flash/input_gen/gen_eos_op/eos_op_data/Gen_eos_op_data/CH-QC-1-001*/**",
    # ★ 同上，BADGER-TOPS 分发表在**兄弟目录** Others_data/ 下（8.5MB / 4 文件）。
    #   旧规则 `*-BADGER-*/**` 只写了 Gen_eos_op_data/ 一层 ⇒ Others_data/ 漏网。
    "flash/input_gen/gen_eos_op/eos_op_data/Others_data/**",
    # === ★★ 测试过程产物 _out/（09-10 实测:275MB，占 wheel 94.5% 的大头）===
    # eosop_pro/test/eosopdata/stepNN_*/_out/ = 各 step 生成的 feos/txt/表副本，
    #   由 .gitignore:99（eosop_pro/test/**/_out/）忽略，纯中间产物，可随时重生成。
    "**/test/**/_out/**",
    "**/_out/**",
    # 各 step 的样例输入数据（非 _out，但同属test 夹具）
    "flash/input_gen/gen_eos_op/eosop_pro/test/eosopdata/**",
    "flash/input_gen/gen_eos_op/eosop_pro/test/parsers/**",
    "flash/input_gen/gen_flychk_his/test/data/**",
    "flash/input_gen/gen_flychk_his/test/out/**",
    # === ★★ SNBtest/src（1.3GB 磁盘 / 29MB 入包, License §3）===
    # .gitignore:220 已用 `**/SNBtest/**` 排除，但★ pyproject 侧缺失 ⇒
    #   4 份 helm_table.dat（各 7.31MB）+ 整套 EosMain F90 源码被打进 wheel。
    #   另：private/ 下 221 个文件是**已跟踪**的自研 SNB 代码，不能整目录排除。
    "**/SNBtest/src/**",
    "flash/scenarios/private/**/helm_table.dat",
    # --- private/tracer/ 精确化（09-10 第三轮修正：整目录排除误伤源码）---
    # ★ 此前写 `private/tracer/**` 整目录排除：虽挡下62GB 产物，却**误伤 116 个
    #   git 已跟踪源码**（151 .py / 33 .md / 9 .sh），含 SNBOneCH_ml.py、
    #   run_cores_parallel.py 等**自研 SNB 场景主线**⇒ 不可接受。
    #   实测：flash_output/** 与 flash_input/** 已由上面的通用规则覆盖；
    #   去掉整目录排除后真正漏网的仅 ~13.9MB，逐条挡如下（各有实测依据）。
    #   - docs_diag/：诊断快照（含 432 个无扩展名 chk，09-09 已单列过）
    "flash/scenarios/private/tracer/**/docs_diag/**",
    #   - plots/：散落的诊断图 PNG（14.5MB / 65 个，非 flash_output 下）
    "flash/scenarios/private/tracer/**/plots/**",
    #   - temp_delete/：临时删除区（5 文件）；__pycache__/：.pyc 兜底
    "flash/scenarios/private/tracer/temp_delete/**",
    "flash/scenarios/private/tracer/**/__pycache__/**",
    #★ 今后凡新增 private/ 排除，必须先核对 `git ls-files flash/scenarios/private`
    #   的已跟踪清单——**禁止**整目录排除（曾误伤 116 个源码文件）。
    # 场景私有的 BADGER-TOPS 分发表（各 2.13MB，git 未跟踪；
    #   权威副本已在 eos_op_data/Gen_eos_op_data/Z*.cn4 随包分发）
    "flash/scenarios/private/**/source/tables/**",
    # === 编辑器/备份残留 ===
    "**/*.bak",
    "**/*.bak[0-9]*",
    # 带时间戳的备份：.bak_20260912_165215（*.bak[0-9]* 匹配不到）
    "**/*.bak_*",
    "**/*.orig",
    "**/*~",
    # === ★ 过程日志/中间产物（按扩展名；已核multi_src 下被跟踪的
    #   399 个文件全是 .py/.md/.C/.H/.dat/.tsv，**零个** .txt/.json/.log/
    #   .out/.csv ⇒ 按扩展名排除不会误伤源码）===
    "**/*.log",
    "**/*.out",
    "**/*.tmp",
    # multi_src 下的探针输出/清单/日志（155 个文件 / 3.6MB）
    "flash/input_gen/gen_eos_op/src/multi_src/**/*.txt",
    "flash/input_gen/gen_eos_op/src/multi_src/**/*.json",
    "flash/input_gen/gen_eos_op/src/multi_src/**/*.csv",
    "flash/input_gen/gen_eos_op/src/multi_src/**/*.out",
    # PDF 抽文本产物（版权衍生物，且体积大）
    "**/docs/extracted/**",
    "flash/input_gen/gen_eos_op/eosop_pro/test/_tmp/**",
]

# ======================================================================
#★★ 为何必须在这里显式写这些规则（.gitignore 明明写了却不管用）===
#
#   根 .gitignore:11 有一条裸 `*`（"忽略所有无扩展名文件"）+ `!*.*` + `!*/`。
#   git 能正确处理它；但 **hatchling 的 VCS 排除有个安全阀**：
#
#       exclude_spec = pathspec.GitIgnoreSpec.from_lines(patterns)
#       if exclude_spec.match_file(self.root):
#           return []          # ← 静默丢弃**全部** VCS 规则
#
#   裸 `*` 匹配到项目根自身 ⇒ 命中该安全阀 ⇒ 536 条 .gitignore 规则**全部失效**。
#   于是 wheel 把 git 忽略的 336.8MB 测试产物 + FLASH 引擎源码一并打包。
#
#   ⇒ 结论：**本仓库的 .gitignore 无法充当 wheel 排除规则**，两者必须成对手写。
#   改动 .gitignore:11 那条 `*` 风险高（会同时改变 git 的忽略语义），故不动；
#   改为在此处显式补齐，并用 scripts/08_offline_install/wheel_leak_audit.py
#   做回归守护（构建后跑一次，git-ignored 却入包的文件必须为 0）。
#   详见 MEMORY.md「wheel 体积铁律」与 reference §P2。
# ======================================================================

[tool.hatch.build.targets.sdist]
include = [
    "**/*.py",
    "**/*.md",
    "flash/_core/credentials/hpc_accounts.example.json",
    "flash/input_gen/gen_eos_op/eos_op_data/Gen_eos_op_data/**/Z*.cn4",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    # === FLASH CENTER compliance exclusions ===
    "flash/flash_src/**",
    "FLASH4.8/**",
    "flash/input_gen/SimulationMain/**",
    "flash/input_gen/gen_eos_op/eos_op_data/FLASH_eos_op_data/**",
    "flash/scenarios/flash_demo/LaserSlab*/**",
    "flash/scenarios/flash_demo/LaserSlabPAR.xlsx",
    "flash/scenarios/flash_demo/ReDo042sp_*/**",
    "flash/scenarios/flash_demo/demo_hpc/demo_task/**",
    "flash/scenarios/flash_demo/demo_local/demo_task/**",
