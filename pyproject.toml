    # --- private/tracer/ 精确化（09-10 第三轮修正：整目录排除误伤源码）---
    # ★ 此前写 `private/tracer/**` 整目录排除：虽挡下62GB 产物，却**误伤 116 个
    #   git 已跟踪源码**（151 .py / 33 .md / 9 .sh），含 SNBOneCH_ml.py、
    #   run_cores_parallel.py 等**自研 SNB 场景主线**⇒ 不可接受。
    #   实测：flash_output/** 与 flash_input/** 已由上面的通用规则覆盖；
    #   去掉整目录排除后真正漏网的仅 ~13.9MB，逐条挡如下（各有实测依据）。
    #   - docs_diag/：诊断快照（含 432 个无扩展名 chk，09-09 已单列过）
    "flash/scenarios/private/tracer/**/docs_diag/**",
    #   - plots/：散落的诊断图 PNG（14.5MB / 65 个，非 flash_output 下）
    "flash/scenarios/private/tracer/**/plots/**",
    #   - temp_delete/：临时删除区（5 文件）；__pycache__/：.pyc 兜底
    "flash/scenarios/private/tracer/temp_delete/**",
    "flash/scenarios/private/tracer/**/__pycache__/**",
    #★ 今后凡新增 private/ 排除，必须先核对 `git ls-files flash/scenarios/private`
    #   的已跟踪清单——**禁止**整目录排除（曾误伤 116 个源码文件）。
    "flash/scenarios/private/**/source/tables/**",
    # 编辑器/备份残留
    "**/*.bak",
    "**/*.bak[0-9]*",
    "**/*.bak_*",
    "**/*.orig",
    "**/*~",
    # 过程日志/中间产物（与 wheel target 成对维护）
    "**/*.log",
