[build-system]
# hatchling (PyPI 推荐): 标准布局, flash/ 子目录即包, 无 sources 重写,
# 同时支持 `pip install .` 与 `pip install -e .` (dev 模式无前缀追加问题)
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flash-sim"
version = "0.1.0"
description = "FLASH plasma simulation Python interface - third-party wrapper and workflow toolkit for FLASH 4.8 radiation-hydrodynamics code. NOT affiliated with the Flash Center for Computational Science. FLASH must be obtained separately from flash.rochester.edu."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "PhySimX Contributors"},
]
keywords = ["flash", "plasma", "simulation", "high-energy-density", "physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
]

# Runtime dependencies.
# This package is fully self-contained: the base schema/interface/registry live
# in the vendored `flash/_core/` subpackage, so no PhySimX-internal package is needed.
# Every dependency listed here is resolvable from PyPI.
dependencies = [
    "cryptography>=41.0",   # Fernet encryption for the credential store
    "numpy>=1.24",           # Numerical operations
]

[project.urls]
Homepage = "https://gitee.com/physimx/flash"
Repository = "https://gitee.com/physimx/flash"
Issues = "https://gitee.com/physimx/flash/issues"

[project.optional-dependencies]
# Full features: HDF5 I/O, plotting and AMR visualisation.
full = [
    "h5py>=3.8",              # HDF5 file reading
    "matplotlib>=3.7",        # Plotting
    "yt>=4.1",               # FLASH HDF5 visualization
    "pandas>=2.0",            # Tabular diffing in the AMR comparison tests
]

# Development dependencies (含测试与发布工具)
# 注: paramiko (远程部署 SSH) 由 start_flash.py 脚本补装, 不入 dev
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "build>=1.0",
    "twine>=5.0",
    "pandas>=2.0",           # 测试 (amr_visualization 对比)
    "scipy>=1.10",           # 测试 (插值/拟合)
]

[project.scripts]
# CLI tools
flash-cred = "flash._core.credentials:interactive_menu"
flash-setup = "flash.config:main"

[tool.hatch.build.targets.wheel]
packages = ["flash"]
exclude = [
    # === FLASH 版权材料与引擎相关 (License §3) ===
    "flash/flash_src/**",
    "flash/**/ref_f90s/**",
    "flash/**/refs/**",
    "flash/**/ionmix/**",
    "flash/**/MultiEOS/**",
    "flash/**/para_doc/**",
    "flash/**/abjt_03.f",
    "flash/**/SimulationMain/**",
    "flash/input_gen/gen_eos_op/eos_op_data/FLASH_eos_op_data/**",
    "flash/scenarios/flash_demo/LaserSlab*/**",
    "flash/scenarios/flash_demo/LaserSlabPAR.xlsx",
    "flash/scenarios/flash_demo/ReDo042sp_*/**",
    "flash/scenarios/flash_demo/new_struture/**",
    # === FLASH 场景源文件与运行脚本 (需在 FLASH 中单独获取) ===
    "*.F90", "*.f90", "*.F", "*.f",
    "Config", "Makefile", "*.par", "*.sh",
    # === 私有场景: 仅排除 FLASH 版权材料 (sim_input_*), 自研 Python 模块入包 ===
    "flash/scenarios/collision_compression/thin_layer_sandwich/sim_input_*/**",
    "flash/scenarios/collision_compression/thin_layer_sandwich/**/*.cn4",
    "flash/scenarios/collision_compression/grad_dens_sandwich/**",
    # === 运行产物 / 测试 / 缓存 ===
    "flash/**/runs_*/**",
    "flash/**/runs/**",
    "flash/**/outputfiles/**",
    "flash/**/output/**",
    "flash/**/inputfiles/**",
    "flash/**/temp/**",
    "flash/**/demo_task/**",
    "flash/input_gen/test/**",
    "flash/output_processors/test/**",
    "flash/**/__pycache__/**",
    "flash/**/.pytest_cache/**",
    # === 二进制/数据文件 ===
    "*.h5", "*.hdf5", "*.pdf", "*.cn4", "*.cnr", "*.imx", "*.ses", "*.png", "*.xlsx",
]

[tool.hatch.build.targets.sdist]
include = [
    "**/*.py",
    "**/*.md",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    # === FLASH CENTER compliance exclusions ===
    "flash/flash_src/**",
    "FLASH4.8/**",
    "flash/input_gen/SimulationMain/**",
    "flash/input_gen/gen_eos_op/eos_op_data/FLASH_eos_op_data/**",
    "flash/scenarios/flash_demo/LaserSlab*/**",
    "flash/scenarios/flash_demo/LaserSlabPAR.xlsx",
    "flash/scenarios/flash_demo/ReDo042sp_*/**",
    "flash/scenarios/flash_demo/demo_hpc/demo_task/**",
    "flash/scenarios/flash_demo/demo_local/demo_task/**",
    "flash/scenarios/flash_demo/demo_task/**",
    "docs/license_agreement.txt",
    "license_agreement_FLASH.txt",
    "flash/scenarios/flash_demo/new_struture/*/runs/**",
    "flash/scenarios/flash_demo/new_struture/**",
    "test/scenarios/runs_*/**",
    "flash/scenarios/chsich_grad/run_tools/runs_*/**",
    "flash/scenarios/chsich/run_tools/runs_*/**",
    "scenarios - 副本/**",
    # === FLASH 版权材料与参考源码 (License §3) ===
    "**/ref_f90s/**",
    "**/refs/**",
    "**/ionmix/**",
    "**/MultiEOS/**",
    "**/para_doc/**",
    "**/abjt_03.f",
    "docs/flash4_ug_4p8.md",
    "docs/flash4_ug_4p8_temp.txt",
    # === 私有场景: 仅排除 FLASH 版权材料 (sim_input_*), 自研 Python 模块入包 ===
    "flash/scenarios/collision_compression/thin_layer_sandwich/sim_input_*/**",
    "flash/scenarios/collision_compression/thin_layer_sandwich/**/*.cn4",
    "flash/scenarios/collision_compression/grad_dens_sandwich/**",
    # === 内部开发文档/工具/测试 (不随包发布) ===
    "/docs/**",
    "/scripts/**",
    "/test/**",
    # === 旧副本 / 内部文件 ===
    "output_processors_copy/**",
    "input_gen/gen_eos_op_copy/**",
    "test/grid_rede_backup_v9/**",
    "test/grid_rede_copy_main/**",
    "test/newpara/flash_input/**",
    "test/newpara/flash_profile/**",
    "test/newpara/output/**",
    "test/hdf5ploter_easy/output/**",
    "**/demo_hpc/demo_task/**",
    "**/demo_local/demo_task/**",
    "**/demo_task/**",
    "**/runs/**",
    "**/outputfiles/**",
    "**/output/**",
    "**/inputfiles/**",
    "**/temp/**",
    # === Other exclusions ===
    "flash/output_processors/inputfiles/**",
    "test/outputfiles/**",
    "test/temp_delete/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/.workbuddy/**",
    "*.h5",
    "*.hdf5",
    "*.pdf",
    "*.cn4",
    "*.cnr",
    "*.imx",
    "*.ses",
    "*.png",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
norecursedirs = ["scenarios - 副本", "__pycache__", ".pytest_cache"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"
