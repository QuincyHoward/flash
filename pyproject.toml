[build-system]
# setuptools (not hatchling): this project's repository root IS the `flash`
# package, and hatchling refuses editable installs whenever a `sources`
# rewrite *adds* a path prefix (hatchling/builders/wheel.py raises
# "Dev mode installations are unsupported when any path rewrite in the
# `sources` option changes a prefix rather than removes it").
# setuptools expresses this layout natively via package_dir={"flash": "."}
# (configured in setup.py), so both `pip install .` and `pip install -e .`
# produce a working `import flash`.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-sim"
version = "1.0.0"
description = "FLASH plasma simulation Python interface - third-party wrapper and workflow toolkit for FLASH 4.8 radiation-hydrodynamics code. NOT affiliated with the Flash Center for Computational Science. FLASH must be obtained separately from flash.rochester.edu."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0 (Python code); FLASH License Agreement (FLASH engine - see NOTICE)"}
authors = [
    {name = "PhySimX Contributors"},
]
keywords = ["flash", "plasma", "simulation", "high-energy-density", "physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
]

# Runtime dependencies.
# This package is fully self-contained: the base schema/interface/registry live
# in the vendored `_core/` subpackage, so no PhySimX-internal package is needed.
# Every dependency listed here is resolvable from PyPI.
dependencies = [
    "cryptography>=41.0",   # Fernet encryption for the credential store
    "numpy>=1.24",           # Numerical operations
]

[project.optional-dependencies]
# Full features: HDF5 I/O, plotting and AMR visualisation.
full = [
    "h5py>=3.8",              # HDF5 file reading
    "matplotlib>=3.7",        # Plotting
    "yt>=4.1",               # FLASH HDF5 visualization
    "pandas>=2.0",            # Tabular diffing in the AMR comparison tests
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
# CLI tools
flash-cred = "flash._core.credentials:interactive_menu"
flash-setup = "flash.config:main"

[tool.setuptools]
# NOTE: the concrete package mapping lives in setup.py, because the repository
# root itself is the `flash` package and that requires a computed subpackage
# list (package_dir = {"flash": "."} + find_packages). Declarative-only config
# cannot express a root-as-package layout.
zip-safe = false

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
norecursedirs = ["scenarios - 副本", "__pycache__", ".pytest_cache"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"
