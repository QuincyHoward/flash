    # === FLASH 版权材料与参考源码 (License §3) ===
    "**/ref_f90s/**",
    "**/refs/**",
    "**/ionmix/**",
    "**/MultiEOS/**",
    "**/para_doc/**",
    "**/abjt_03.f",
    "docs/flash4_ug_4p8.md",
    "docs/flash4_ug_4p8_temp.txt",
    # === 私有场景: 仅排除 FLASH 版权材料 (sim_input_*), 自研 Python 模块入包 ===
    "flash/scenarios/collision_compression/thin_layer_sandwich/sim_input_*/**",
    "flash/scenarios/collision_compression/thin_layer_sandwich/**/*.cn4",
    "flash/scenarios/collision_compression/grad_dens_sandwich/**",
    # === 内部开发文档/工具/测试 (不随包发布) ===
    "/docs/**",
    "/scripts/**",
    "/test/**",
    # === 用户临时调试脚本 (非通用发布代码, 含硬编码路径) ===
    "flash/flash_run/remote/remote_check.py",
    "flash/flash_run/remote/remote_workflow.py",
    "flash/flash_run/remote/ssh_check.py",
    # === 旧副本 / 内部文件 ===
    "output_processors_copy/**",
    "input_gen/gen_eos_op_copy/**",
    "test/grid_rede_backup_v9/**",
    "test/grid_rede_copy_main/**",
    "test/newpara/flash_input/**",
    "test/newpara/flash_profile/**",
    "test/newpara/output/**",
    "test/hdf5ploter_easy/output/**",
    "**/demo_hpc/demo_task/**",
    "**/demo_local/demo_task/**",
    "**/demo_task/**",
    "**/runs/**",
    "**/outputfiles/**",
    "**/output/**",
    "**/inputfiles/**",
    "**/temp/**",
    # === 场景生成的输入/输出数据（与 wheel target 成对维护，见上方注释）===
    "flash/scenarios/**/flash_input/**",
    "flash/scenarios/**/flash_output/**",
    "**/flash_input_old/**",
    # === ★ 大体积第三方参考数据 + 打包归档（与 wheel target 成对维护）===
    # Multi1D++ 便携包 ≈1.5GB（第三方参考解）；副本目录内容重复；
    # tar/rar/tgz 归档非代码。详见 wheel target 上方的说明。
    "**/src/Multi1D++Portable*/**",
    "**/Multi1D*/**",
    "**/Multi1D*.rar",
    "flash/input_gen/*_copy/**",
    "flash/input_gen/*副本*/**",
    "**/*_copy/**",
    "**/*_Copy/**",
    "**/*_COPY/**",
    "**/*副本*/**",
    "**/*.rar",
    "**/*.tar",
    "**/*.tgz",
    "**/*.tar.gz",
    # === 诊断遗留 / AI 工作区临时文件（与 wheel target 成对维护）===
    "**/_flash_output_contaminated_*/**",
    "**/*contaminated*/**",
    "flash/**/.workbuddy/**",
