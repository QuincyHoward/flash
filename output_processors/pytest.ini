[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --ignore=test/temp_delete --ignore=test/amr_visualization/d1 --ignore=test/amr_visualization/d2 --ignore=test/amr_visualization/d3 --ignore=test/amr_visualization/test_amr_visualization.py
markers =
    performance: performance regression tests
    slow: slow tests (skip in CI)
    yt: tests requiring yt installation
